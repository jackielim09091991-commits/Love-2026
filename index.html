<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --primary-color: #ffb3b3;
        /* 更加细腻的背景和光影 */
body {
    background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
}

.swiper-slide {
    perspective: 1000px; /* 增加 3D 感 */
}

.swiper-slide img {
    max-width: 85%;
    max-height: 75vh;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* 音乐按钮做成半透明磨砂 */
#music-control {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
}
        }
        .rotating { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Carousel 容器 */
        .swiper {
            width: 100%; height: 100vh;
        }
        .swiper-slide {
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .swiper-slide img {
            max-width: 90%; max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,179,179,0.2);
            object-fit: contain;
        }

        /* 文字装饰 */
        .content {
            position: absolute; bottom: 10%;
            width: 100%; text-align: center;
            color: var(--primary-color);
            z-index: 10;
        }
        .content h2 { font-weight: 200; letter-spacing: 3px; font-size: 1.2rem; }
        .hint { font-size: 0.7rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="music-control">🎵</div>
    
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="https://i.ibb.co/9mFF3cJF/Whats-App-Image-2026-02-13-at-11-16-40-PM-1.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/cShRN19d/Whats-App-Image-2026-02-13-at-11-16-40-PM-2.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/4Z11Tc0P/Whats-App-Image-2026-02-13-at-11-16-40-PM-3.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/VpBcftkd/Whats-App-Image-2026-02-13-at-11-16-40-PM-4.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/PzWVtbBJ/Whats-App-Image-2026-02-13-at-11-16-40-PM-5.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/WvSKmPxt/Whats-App-Image-2026-02-13-at-11-16-40-PM-6.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/KjXbcG49/Whats-App-Image-2026-02-13-at-11-16-40-PM-7.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/ZprdBHxw/Whats-App-Image-2026-02-13-at-11-16-40-PM-8.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/fdJT1vzz/Whats-App-Image-2026-02-13-at-11-16-40-PM-9.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/jZBWP5Hq/Whats-App-Image-2026-02-13-at-11-16-40-PM-10.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/hFjsWsvR/Whats-App-Image-2026-02-13-at-11-16-40-PM-11.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/Rkdk4dk4/Whats-App-Image-2026-02-13-at-11-16-40-PM-12.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/LzDBd9dw/Whats-App-Image-2026-02-13-at-11-16-40-PM-13.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/z37Mhsg/Whats-App-Image-2026-02-13-at-11-16-40-PM-14.jpg"></div>
            <div class="swiper-slide"><img src="https://i.ibb.co/7x4Jmhkq/Whats-App-Image-2026-02-13-at-11-16-40-PM.jpg"></div>
        </div>
        
        <div class="content">
            <h2>Our Journey</h2>
            <div class="hint">左划开启回忆 (记得点右上角音乐)</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // 初始化 Carousel
        const swiper = new Swiper('.swiper', {
            loop: true,
            effect: 'fade', // 渐隐渐现效果，比直接滑动更浪漫
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
        });

        // 音乐控制逻辑
        const audio = document.getElementById('bgm');
        const btn = document.getElementById('music-control');
        
        btn.onclick = function() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('rotating');
            } else {
                audio.pause();
                btn.classList.remove('rotating');
            }
        };

        // 兼容性：第一次点击页面开始放歌
        document.body.onclick = function() {
            if (audio.paused) {
                audio.play();
                btn.classList.add('rotating');
            }
        };
    </script>
</body>

</html>
